<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Online Library</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet"
  />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
</head>
<body>

  <!-- ====================================================================
       TOP NAVIGATION BAR
       ==================================================================== -->
  <header class="navbar">
    <div class="navbar__container">
      
      <!-- Logo -->
      <a href="/books" class="navbar__logo">
        <i class="ph ph-books"></i>
        <span>Online <span class="brand-accent">Library</span></span>
      </a>

      <!-- Navigation Links -->
      <nav class="navbar__nav" id="navbar-nav">
        <a href="/books" class="nav-link">
  <i class="ph-bold ph-house"></i> Home
</a>

<a href="/books" class="nav-link">
  <i class="ph-bold ph-magnifying-glass"></i> Books
</a>

<a href="/library" class="nav-link">
  <i class="ph-bold ph-bookmarks"></i> My Library
</a>

<div class="navbar__auth">
  <a href="/login" class="btn btn-outline">Log In</a>
  <a href="/register" class="btn btn-primary active">Sign Up</a>
</div>
      </nav>

      <!-- Mobile Menu Toggle Button -->
      <button class="navbar__toggle" id="menu-toggle" aria-label="Toggle navigation">
        <i class="ph-bold ph-list"></i>
      </button>

    </div>
  </header>

  <!-- ====================================================================
       MAIN AUTHENTICATION CONTENT
       ==================================================================== -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <div class="auth-card__header">
        <div class="auth-card__icon-badge">
          <i class="ph-bold ph-user-plus"></i>
        </div>
        <h1 class="auth-card__title">Create an Account</h1>
        <p class="auth-card__subtitle">Join Online Library to track, read, and save your favourite books</p>
      </div>

      <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
        
        <!-- Full Name Field -->
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <div class="form-input-wrapper">
            <i class="ph-bold ph-user form-input-icon"></i>
            <input
              type="text"
              id="reg-name"
              class="form-control"
              placeholder="Jane Austen"
              required
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <div class="form-input-wrapper">
            <i class="ph-bold ph-envelope form-input-icon"></i>
            <input
              type="email"
              id="reg-email"
              class="form-control"
              placeholder="you@example.com"
              required
              autocomplete="email"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="reg-password" class="form-label">Password</label>
          <div class="form-input-wrapper">
            <i class="ph-bold ph-lock form-input-icon"></i>
            <input
              type="password"
              id="reg-password"
              class="form-control"
              placeholder="At least 8 characters"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              id="password-toggle"
              aria-label="Toggle password visibility"
              onclick="togglePasswordVisibility('reg-password', this)"
            >
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="form-input-wrapper">
            <i class="ph-bold ph-shield-check form-input-icon"></i>
            <input
              type="password"
              id="reg-confirm-password"
              class="form-control"
              placeholder="Repeat your password"
              required
              autocomplete="new-password"
            />
            <button
              type="button"
              class="password-toggle-btn"
              aria-label="Toggle confirm password visibility"
              onclick="togglePasswordVisibility('reg-confirm-password', this)"
            >
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <!-- Terms Agreement Checkbox -->
        <div class="form-group-checkbox">
          <input type="checkbox" id="agree-terms" required />
          <label for="agree-terms">I agree to the Terms of Service and Privacy Policy</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block">
          <span>Create Account</span>
          <i class="ph-bold ph-arrow-right"></i>
        </button>

      </form>

      <div class="auth-card__footer">
        <p>Already have an account? <a href="/login" class="auth-link">Log in</a></p>
      </div>

    </div>
  </main>

  <!-- ====================================================================
       BASIC FOOTER
       ==================================================================== -->
  <footer class="footer">
    <div class="footer__simple-container">
      <div class="footer__simple-brand">
        <i class="ph ph-books"></i>
        <span>Online <span class="brand-accent">Library</span></span>
      </div>
      <p class="footer__copyright">&copy; 2026 Online Library. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script>
function togglePasswordVisibility(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector("i");

  if (input.type === "password") {
    input.type = "text";
    icon.className = "ph-bold ph-eye-slash";
  } else {
    input.type = "password";
    icon.className = "ph-bold ph-eye";
  }
}

async function handleRegister(e) {
  e.preventDefault();

  const name = document.getElementById("reg-name").value;
  const email = document.getElementById("reg-email").value;
  const password = document.getElementById("reg-password").value;
  const confirmPassword = document.getElementById("reg-confirm-password").value;

  if (password !== confirmPassword) {
    window.showAppDialog({
      title: "Password Mismatch",
      message: "The passwords do not match.",
      icon: "ph-bold ph-warning-circle",
      confirmText: "Try Again"
    });
    return;
  }

  try {
    const res = await fetch("/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        email,
        password
      })
    });

    const data = await res.json();

    if (res.ok) {
      window.showAppDialog({
        title: "Account Created!",
        message: data.message,
        icon: "ph-bold ph-seal-check",
        confirmText: "Go to Login",
        onConfirm: () => {
          window.location.href = "/login";
        }
      });
    } else {
      window.showAppDialog({
        title: "Registration Failed",
        message: data.message,
        icon: "ph-bold ph-warning-circle",
        confirmText: "Try Again"
      });
    }
  } catch (err) {
    window.showAppDialog({
      title: "Server Error",
      message: "Unable to connect to the server.",
      icon: "ph-bold ph-wifi-slash",
      confirmText: "OK"
    });
  }
}
</script>
</body>
</html>
